plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

base {
    archivesName = "shredder"
}
version = "0.1.0"
group = "shredder"

dependencies {
    compileOnly fileTree(dir: rootProject.file(".gradle/loom-cache/minecraftMaven/net/minecraft"), include: "**/26.2/*.jar")
    compileOnly fileTree(dir: new File(System.getProperty("user.home"), ".gradle/caches/fabric-loom/minecraftMaven/net/minecraft"), include: "**/26.2/*.jar")
    compileOnly fileTree(dir: rootProject.file(".gradle/loom-cache/remapped_mods/remapped/net/fabricmc/fabric-api"), include: "**/*.jar")
    compileOnly fileTree(dir: new File(System.getProperty("user.home"), ".gradle/caches/fabric-loom/remapped_mods/remapped/net/fabricmc/fabric-api"), include: "**/*.jar")
    compileOnly fileTree(dir: new File(System.getProperty("user.home"), ".gradle/caches/modules-2/files-2.1/net.fabricmc.fabric-api"), include: "**/*.jar")
    compileOnly "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    compileOnly "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    compileOnly "com.google.guava:guava:33.5.0-jre"
    compileOnly "it.unimi.dsi:fastutil:8.5.16"
    compileOnly "com.mojang:brigadier:1.3.10"
    compileOnly "org.joml:joml:1.10.8"
    compileOnly "org.slf4j:slf4j-api:2.0.17"
    compileOnly "org.lwjgl:lwjgl:3.3.3"
    compileOnly "com.mojang:datafixerupper:8.0.16"
    compileOnly "com.google.code.gson:gson:2.13.2"
    compileOnly "org.apache.commons:commons-lang3:3.20.0"
    compileOnly "commons-io:commons-io:2.21.0"
    compileOnly "io.netty:netty-buffer:4.2.15.Final"
    compileOnly "io.netty:netty-common:4.2.15.Final"
    compileOnly "io.netty:netty-transport:4.2.15.Final"
    compileOnly "org.ow2.asm:asm:9.9"

    // Baritone dependencies
    compileOnly "org.spongepowered:mixin:0.8"
    implementation "dev.babbaj:nether-pathfinder:1.4.1"
    implementation 'com.google.code.findbugs:jsr305:3.0.2'

    // Tungsten — physics-based movement, used by TungstenBridge
    compileOnly project(path: ":tungsten", configuration: "namedElements")
}

configurations {
    namedElements {
        canBeConsumed = true
        canBeResolved = false
        extendsFrom implementation
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_API))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        }
    }
}

artifacts {
    namedElements jar
}

repositories {
    maven {
        name = 'babbaj-repo'
        url = 'https://babbaj.github.io/maven/'
    }
    maven {
        name = 'spongepowered-repo'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    mavenCentral()
}

// All source sets merged into main for unified Mojang mappings
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
    inputs.property("version", project.version)
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}
